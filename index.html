<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026全国大会 席次検索</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 15px;
    }
    .header { 
      text-align: center; 
      color: white; 
      margin-bottom: 20px; 
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
    }
    .search-container {
      position: relative;
      margin-bottom: 25px;
    }
    .search-box { 
      width: 100%; 
      padding: 22px 25px 22px 55px; 
      font-size: 20px; 
      border: 4px solid #FFD700;
      border-radius: 25px; 
      box-shadow: 0 8px 30px rgba(255,215,0,0.4), 0 0 0 1px rgba(255,255,255,0.2);
      margin-bottom: 10px;
      background: rgba(255,255,255,0.98);
      transition: all 0.3s ease;
      font-weight: 600;
      z-index: 1;
    }
    .search-box:focus {
      outline: none;
      border-color: #FFA500;
      box-shadow: 0 10px 40px rgba(255,165,0,0.5), 0 0 0 1px rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }
    .search-box::placeholder {
      color: #666;
      font-weight: 500;
    }
    .search-icon {
      position: absolute;
      left: 22px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: #FF8C00;
      z-index: 2;
      pointer-events: none;
    }
    .search-label {
      position: absolute;
      right: 20px;
      top: -15px;
      background: #FF4500;
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(255,69,0,0.4);
      animation: bounce 2s infinite;
      z-index: 3;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
      60% { transform: translateY(-3px); }
    }
    .instructions { 
      background: rgba(255,255,255,0.9); 
      padding: 15px; 
      border-radius: 12px; 
      margin-bottom: 20px; 
      text-align: center;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    
    .seating-container {
      background: rgba(255,255,255,0.15); 
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      padding: 20px;
      margin-bottom: 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    
    .row-group {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      min-width: max-content;
      align-items: center;
    }
    
    /* 通路スペース（席と同じ幅・透明） */
    .aisle-space {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }
    
    .seat { 
      background: rgba(255,255,255,0.92); 
      width: 52px; 
      height: 52px; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 9px; 
      font-weight: 600;
      border-radius: 8px; 
      transition: all 0.25s ease; 
      cursor: pointer;
      position: relative;
      border: 2px solid transparent;
    }
    
    .seat:hover { 
      transform: scale(1.08); 
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
    
    .highlight { 
      background: linear-gradient(45deg, #ffeb3b, #ff9800) !important; 
      box-shadow: 0 0 25px rgba(255,235,59,0.9) !important;
      transform: scale(1.15) !important;
      animation: pulse 0.8s infinite;
      border-color: #f57c00 !important;
    }
    
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 25px rgba(255,235,59,0.9); }
      50% { box-shadow: 0 0 35px rgba(255,235,59,1); }
    }
    
    .seat-name { 
      font-size: 8px; 
      line-height: 1.1; 
      max-width: 44px;
      text-align: center;
      word-break: break-all;
      margin-bottom: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .seat-id { 
      font-size: 7px; 
      opacity: 0.8;
    }
    
    .loading { 
      text-align: center; 
      padding: 50px 15px; 
      font-size: 16px; 
      color: white; 
      background: rgba(255,255,255,0.2);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      margin: 20px 0;
    }
    
    @media (max-width: 480px) { 
      body { padding: 10px; }
      .search-box { padding: 20px 22px 20px 50px; font-size: 18px; }
      .search-icon { width: 18px; height: 18px; left: 20px; }
      .seat, .aisle-space { width: 48px; height: 48px; }
      .seat-name { font-size: 7.5px; }
      .seat-id { font-size: 6.5px; }
      .row-group { gap: 3px; margin-bottom: 6px; }
    }
  </style>
</head>

    document.getElementById('searchInput').addEventListener('input', function() {
      const query = this.value.toLowerCase().trim();
      document.querySelectorAll('.seat').forEach(seat => {
        seat.classList.remove('highlight');
        if (query && seat.dataset.store && 
            seat.dataset.store.toLowerCase().includes(query)) {
          seat.classList.add('highlight');
          seat.scrollIntoView({ 
            behavior: 'smooth', 
            block: 'center',
            inline: 'nearest'
          });
        }
      });
    });
    
    function displaySeating() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('seatingContainer').style.display = 'block';
      
      const container = document.getElementById('seatingContainer');
      const rowLabels = ['A','B','C','D','E','F','G','H','I','J','K','L','M',];
      
      rowLabels.forEach(row => {
        const rowGroup = document.createElement('div');
        rowGroup.className = 'row-group';
        
        // 席番号カウンタ（通路スキップ）
        let seatCol = 1;
        
        for(let displayCol = 1; displayCol <= 29; displayCol++) { 
          // 通路判定（9-10間、18-19間、J-K間）
          const isAisle1 = (displayCol === 10);      // 9-10間
          const isAisle2 = (displayCol === 20);      // 18-19間  
          const isAisle3 = false; // J列も他列と同じ
          
          if (isAisle1 || isAisle2 || isAisle3) {
            // 通路スペース（透明・席幅）
            const aisleSpace = document.createElement('div');
            aisleSpace.className = 'aisle-space';
            rowGroup.appendChild(aisleSpace);
          } else {
            // 席
            const seatId = row + '-' + seatCol;
            const seat = document.createElement('div');
            seat.className = 'seat';
            
            const seatData = seatingData.find(s => s.seat === seatId);
            if (seatData) {
              seat.innerHTML = `
                <div class="seat-name">${seatData.store}</div>
                <div class="seat-id">${seatId}</div>
              `;
              seat.dataset.store = seatData.store;
              seat.onclick = () => {
                navigator.vibrate?.(100);
                alert(`${seatData.store}\n席番号：${seatId}`);
              };
            } else {
              seat.innerHTML = `<div class="seat-id">${seatId}</div>`;
              seat.dataset.store = '';
              seat.style.opacity = '0.4';
            }
            seat.dataset.seatId = seatId;
            rowGroup.appendChild(seat);
            seatCol++; // 席番号進める
          }
        }
        container.appendChild(rowGroup);
      });
    }
